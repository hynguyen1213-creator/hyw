name: G.LENS iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signing:
        description: Build unsigned for later signing, or signed for registered devices
        required: true
        type: choice
        default: unsigned
        options:
          - unsigned
          - signed
permissions:
  contents: read
concurrency:
  group: glens-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.gstudio.glens' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare signing in temporary keychain
        if: inputs.signing == 'signed'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/prepare_signing.sh
      - name: Verify exposure, crop and metering math
        run: |
          mkdir -p build
          swiftc GLens/ProMath.swift Tests/ProMathTests.swift -o build/pro-math-tests
          build/pro-math-tests | tee build/tests.log
      - name: Compile archive and package real IPA
        env:
          GLENS_SIGNING_MODE: ${{ inputs.signing || 'unsigned' }}
        run: bash scripts/build_ipa.sh "$GLENS_SIGNING_MODE"
      - name: Upload IPA and checksum
        uses: actions/upload-artifact@v7
        with:
          name: G-LENS-IPA-${{ inputs.signing || 'unsigned' }}
          path: |
            build/*.ipa
            build/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Launch simulator and capture interface
        run: bash scripts/simulator_smoke.sh
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G-LENS-Pro-interface
          path: build/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: G-LENS-build-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing material
        if: always() && inputs.signing == 'signed'
        run: |
          security delete-keychain "$RUNNER_TEMP/glens-signing/build.keychain-db" || true
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/glens-signing"
